# Biblioteca de respostas prontas. Cada intent tem frases; os wavs são pré-gerados
# pelo TTS (script scripts/build_library.py) e cacheados. O servidor sorteia uma variação.
responses:
  acknowledgement:            # tocado LOCALMENTE pelo device no wake — também sincronizado pra ele
    - "Sim?"
    - "Pois não?"
    - "Estou ouvindo."
  light_on_success:
    - "Claro."
    - "Ligando."
    - "Certamente."
    - "Pronto."
  light_off_success:
    - "Apagando."
    - "Pronto."
    - "Desligado."
  # tocado enquanto o LLM ainda esta escrevendo (o 1o token demora ~6s):
  # some da sensacao de travado sem custar nada, ja vem pre-gerado
  thinking:
    - "Um momento."
    - "Deixa eu ver."
    - "Verificando."
  # cumprimento nao passa por LLM nenhum: sai na hora, com audio pronto
  # (o modelo pequeno, solto, ainda respondia "<uma frase curta>" em voz alta)
  saudacao_manha:
    - "Bom dia."
    - "Bom dia, senhor."
    - "Bom dia. Às ordens."
  saudacao_tarde:
    - "Boa tarde."
    - "Boa tarde, senhor."
    - "Boa tarde. Em que posso ajudar?"
  saudacao_noite:
    - "Boa noite."
    - "Boa noite, senhor."
    - "Boa noite. Às ordens."
  saudacao:
    - "Olá."
    - "Às ordens."
    - "Estou aqui."
  agradecimento:
    - "Disponha."
    - "Sempre às ordens."
    - "Por nada."
  despedida:
    - "Até logo."
    - "Estarei por aqui."
  not_understood:
    - "Desculpe, não entendi."
    - "Pode repetir?"
  error:
    - "Houve um problema ao executar isso."
  ambiguous_room:
    - "De qual cômodo?"
