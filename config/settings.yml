server:
  host: 0.0.0.0
  port: 8040

audio:
  sample_rate: 16000
  frame_ms: 80

wake_word:
  # stt = a palavra-chave e reconhecida na propria transcricao, entao da pra falar
  #       "Jarvis, liga a luz" tudo junto e o comando ja vai na mesma frase.
  #       O openwakeword continua ligado em paralelo como atalho instantaneo.
  engine: stt                  # stt | openwakeword
  keyword: jarvis
  fuzzy_max_edits: 2           # tolera "jarves", "javis", "jarvez"...
  openwakeword_model: hey_jarvis
  threshold: 0.4
  # depois de um wake, ignora novos wakes por N segundos
  refractory_s: 2.0
  # quanto de audio anterior ao inicio da fala entra no reconhecimento (s)
  preroll_s: 1.0
  # se so chamou o nome, espera o comando por ate N segundos
  followup_s: 6.0

vad:
  engine: silero
  threshold: 0.5
  # fala continua minima pra acionar o STT (evita transcrever ruido solto)
  min_speech_ms: 240
  # silencio (s) que encerra a fala
  end_silence_s: 0.8
  # tempo maximo ouvindo depois do wake (s)
  max_utterance_s: 12.0

stt:
  # hibrido = Nemotron nas parciais (rapido, acende o reator ao ouvir "Jarvis")
  #           + Whisper na transcricao final (acerta o comando ate com ruido)
  engine: hibrido        # hibrido | nemotron | whisper | dummy
  model: nvidia/nemotron-3.5-asr-streaming-0.6b
  whisper_model: large-v3-turbo
  whisper_compute_type: float16
  language: pt-BR
  chunk_ms: 160
  device: cuda

tts:
  voice_profiles:
    # voz clonada do JARVIS (referencia em server/data/voice/jarvis_ref.wav)
    jarvis_br:
      engine: clone
      service_url: http://127.0.0.1:8041
      language: pt
      exaggeration: 0.5
      cfg_weight: 0.5     # abaixo de 0.3 o Chatterbox quebra
      temperature: 0.7
      timeout_s: 120
      fallback: jarvis_edge   # se o servico de voz estiver fora
    jarvis_edge:
      engine: edge
      voice: pt-BR-AntonioNeural
      rate: "+10%"
      pitch: "-2Hz"
  default_profile: jarvis_br
  cache_dir: server/data/tts_cache
  library_dir: server/data/library
  # mantem sempre no cache as frases previsiveis (hora/temperatura)
  cache_warmer: true
  # fala enquanto o LLM ainda escreve: o 1o pedaco sai com poucas palavras
  # (voz comeca rapido) e os seguintes crescem (prosodia melhor)
  stream_primeiras_palavras: 3
  stream_max_palavras: 14

llm:
  # LiteLLM model string - trocavel sem tocar codigo
  model: deepseek/deepseek-chat
  api_key_env: DEEPSEEK_API_KEY

home_assistant:
  # mock = simula os dispositivos localmente ate o HA real ser configurado
  mode: mock                # mock | real
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  temperature_entity: sensor.temperatura_ambiente

telemetry:
  enabled: true
