server:
  host: 0.0.0.0
  port: 8040

audio:
  sample_rate: 16000
  frame_ms: 80

wake_word:
  # stt = a palavra-chave e reconhecida na propria transcricao, entao da pra falar
  #       "Jarvis, liga a luz" tudo junto e o comando ja vai na mesma frase.
  #       O openwakeword continua ligado em paralelo como atalho instantaneo.
  engine: stt                  # stt | openwakeword
  keyword: jarvis
  fuzzy_max_edits: 2           # tolera "jarves", "javis", "jarvez"...
  openwakeword_model: hey_jarvis
  threshold: 0.4
  # depois de um wake, ignora novos wakes por N segundos
  refractory_s: 2.0
  # quanto de audio anterior ao inicio da fala entra no reconhecimento (s)
  preroll_s: 1.0
  # se so chamou o nome, espera o comando por ate N segundos
  followup_s: 6.0

vad:
  engine: silero
  threshold: 0.5
  # fala continua minima pra acionar o STT (evita transcrever ruido solto)
  min_speech_ms: 240
  # silencio (s) que encerra a fala
  end_silence_s: 0.8
  # tempo maximo ouvindo depois do wake (s)
  max_utterance_s: 12.0

stt:
  # whisper (small) faz TUDO: parciais e final. Medido nesta maquina:
  #   small        0,12s/frase, reconhece o nome em 8/8 audios dificeis
  #   large-v3-turbo 14,7s/frase (sem kernel otimizado pra esta GPU)
  #   nemotron     0,10s mas reconhece o nome em so 2/8 audios dificeis
  engine: whisper        # whisper | hibrido | nemotron | dummy
  model: nvidia/nemotron-3.5-asr-streaming-0.6b   # usado no modo hibrido
  whisper_model: small
  whisper_compute_type: float16
  whisper_beam_size: 1
  whisper_parciais: true          # o proprio whisper gera as parciais
  whisper_intervalo_parcial: 0.45
  language: pt-BR
  chunk_ms: 160
  device: cuda

tts:
  voice_profiles:
    # voz clonada do JARVIS (referencia em server/data/voice/jarvis_ref.wav)
    jarvis_br:
      engine: clone
      service_url: http://127.0.0.1:8041
      language: pt
      exaggeration: 0.5
      cfg_weight: 0.5     # abaixo de 0.3 o Chatterbox quebra
      temperature: 0.7
      timeout_s: 120
      fallback: jarvis_edge   # se o servico de voz estiver fora
    jarvis_edge:
      engine: edge
      voice: pt-BR-AntonioNeural
      rate: "+10%"
      pitch: "-2Hz"
  default_profile: jarvis_br
  cache_dir: server/data/tts_cache
  library_dir: server/data/library
  # mantem sempre no cache as frases previsiveis (hora/temperatura)
  cache_warmer: true
  # fala enquanto o LLM ainda escreve: o 1o pedaco sai com poucas palavras
  # (voz comeca rapido) e os seguintes crescem (prosodia melhor)
  stream_primeiras_palavras: 3
  stream_max_palavras: 14

llm:
  # LiteLLM model string - trocavel sem tocar codigo.
  # ollama_chat/<tag> roda local (nada sai da maquina); precisa do Ollama no ar.
  model: ollama_chat/qwen3.5:0.8b
  api_base: http://127.0.0.1:11434
  api_key_env: DEEPSEEK_API_KEY      # usado se voltar pra um provedor de nuvem
  # o Qwen3.x "pensa" antes de responder e isso custa segundos; num modelo
  # pequeno nao compensa, entao desligamos
  no_think: true
  # prompt enxuto: em modelo pequeno, historico gordo atrasa a 1a palavra
  # (medido: 0,4s -> 2,4s). Cada troca antiga entra truncada.
  historico_trocas: 2
  historico_max_chars: 160
  # resposta curta = menos tempo de sintese de voz (1 frase cabe em ~60 tokens)
  max_tokens: 60
  # corte garantido no servidor: modelo pequeno nao obedece "responda em uma
  # frase" e ainda comenta as proprias instrucoes
  max_frases: 1
  max_palavras: 25
  # opcao de nuvem (mais inteligente, ~1s de latencia):
  # model: deepseek/deepseek-chat

# Agentes: o modelo local roteia; cada agente cuida de um assunto.
agentes:
  # o roteador tambem responde trivialidades (hora, "so um momento...")
  roteador:
    modelo: ollama_chat/qwen3.5:0.8b   # herda api_base/no_think de llm:
  lista:
    - nome: casa
      descricao: luzes, temperatura, dispositivos e automacoes da casa
      exemplos: ["liga a luz da sala", "desliga tudo", "que temperatura esta"]
    - nome: sistema
      descricao: o proprio computador e o assistente (abrir programa, status, volume)
      exemplos: ["abre o navegador", "como voce esta", "aumenta o volume"]
    - nome: conversa
      descricao: perguntas gerais, conhecimento, papo
      exemplos: ["quem foi santos dumont", "me conta uma curiosidade"]
    - nome: avancado
      descricao: pedidos dificeis, que exigem raciocinio ou varios passos
      exemplos: ["compara duas opcoes e me diz qual e melhor", "planeja meu dia"]
      # so entra em acao se o provedor de nuvem estiver ligado abaixo
      requer_nuvem: true

# GPT-5.6 Luna: usado no agente "avancado" e pelo observador. Opcional -
# com ativo: false o sistema roda 100% local, sem mandar nada pra fora.
nuvem:
  ativo: true
  modelo: openai/gpt-5.6-luna
  api_key_env: OPENAI_API_KEY
  # o "pensar antes de responder" vira SILENCIO pra quem esta esperando a voz.
  # `low` e o minimo que este modelo aceita (`minimal`/`none` sao recusados).
  # Medido A/B INTERCALADO, mediana de 9 medicoes ate a 1a palavra
  # (tests/bench_nuvem_onde_vai_o_tempo.py):
  #   pelo agente:  low 0,93s | high 1,24s
  #   chamada crua: low 0,62s | high 0,95s
  # ou seja: low economiza 0,31s, e o caminho do agente custa outros 0,31s.
  # Sem o parametro o modelo ja se comporta perto do low, mas deixar explicito
  # trava o comportamento rapido em vez de depender do padrao da API.
  reasoning_effort: low

# Registro: guarda audio + decisao de cada interacao (base pro aprendizado)
registro:
  ativo: true
  guardar_dias: 30

# Observador: anota o que vale aprender (nao entra no caminho da resposta)
observador:
  ativo: true
  # so analisa quando houve sinal de problema, pra nao gastar API a toa
  quando: [roteador_incerto, pedido_repetido, tarefa_falhou]

home_assistant:
  # mock = simula os dispositivos localmente ate o HA real ser configurado
  mode: mock                # mock | real
  url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  temperature_entity: sensor.temperatura_ambiente

telemetry:
  enabled: true
